<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daraz Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <header class="header">

        <div class="top-links">
            <a href="#">SAVE MORE ON APP</a>
            <a href="#">SELL ON DARAZ</a>
            <a href="#">HELP & SUPPORT</a>
        </div>

        <nav class="navbar">

            <a href="#" class="logo">daraz</a>

            <form class="search-box">
                <input
                    type="text"
                    placeholder="Search in Daraz..."
                    aria-label="Search products">

                <button type="submit" aria-label="Search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>

            <div class="nav-right">
                <a href="#">Login</a>
                <span>|</span>
                <a href="#">Sign Up</a>

                <a href="#" class="cart" aria-label="Shopping cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                </a>
            </div>

        </nav>

    </header>
    <!-- Hero Banner Start -->
<section class="hero">

    <div class="hero-content">
        <span class="sale-tag">MEGA SALE</span>

        <h1>Big Sale, Big Savings!</h1>

        <p>
            Discover amazing deals on electronics,
            fashion and much more.
        </p>

        <a href="#" class="shop-btn">Shop Now</a>
    </div>

    <div class="hero-image">
        <img
            src="https://images.unsplash.com/photo-1607082349566-187342175e2f?auto=format&fit=crop&w=900&q=80"
            alt="Shopping sale banner">
    </div>

</section>
<!-- Hero Banner End -->

</body>
</html>
